<!doctype html>
<html lang="pt-PT">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Orb</title>
<link rel="stylesheet" href="interaction.css">
<link rel="stylesheet" href="ui.css">

<div class="stage">
  <div class="device" id="device">
    <div class="bg" id="bg"></div>

    <div class="app" id="app">
      <div class="status" aria-hidden="true"><i style="width:42px"></i><span class="r"><i style="width:18px"></i><i style="width:16px"></i><i style="width:26px"></i></span></div>
      <button class="stories-btn" id="storiesBtn" type="button" aria-label="Abrir stories"></button>
      <div class="pager" id="pager"><div class="track" id="track"></div></div>
      <div class="dots" id="dots" role="group" aria-label="Views"></div>
      <button class="nb-btn" id="nbBtn" type="button" aria-label="Abrir notebook"></button>
    </div>

    <div class="notebook" id="notebook" role="dialog" aria-label="Notebook" tabindex="-1">
      <div class="nb-head">
        <div class="nb-top">
          <button class="close" id="nbClose" type="button" aria-label="Fechar notebook"></button>
          <i class="b s" style="width:34%;height:16px"></i><span class="spacer"></span>
          <button class="nb-icon nb-edit" id="nbEdit" type="button" aria-label="Reordenar cartões" aria-pressed="false"></button>
          <span class="nb-icon nb-add" aria-hidden="true"></span>
        </div>
        <div class="nb-bar"><span class="nb-search" aria-hidden="true"><span class="mag"></span></span><div class="nb-tools"><button type="button" data-layout="grid" aria-label="Grelha" class="on"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="2.5" width="4" height="4" rx="1"/><rect x="8" y="2.5" width="4" height="4" rx="1"/><rect x="13.5" y="2.5" width="4" height="4" rx="1"/><rect x="2.5" y="8" width="4" height="4" rx="1"/><rect x="8" y="8" width="4" height="4" rx="1"/><rect x="13.5" y="8" width="4" height="4" rx="1"/><rect x="2.5" y="13.5" width="4" height="4" rx="1"/><rect x="8" y="13.5" width="4" height="4" rx="1"/><rect x="13.5" y="13.5" width="4" height="4" rx="1"/></svg></button><button type="button" data-layout="cards" aria-label="Cartões"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="2.5" width="6.5" height="15" rx="2"/><rect x="11" y="2.5" width="6.5" height="15" rx="2"/></svg></button><button type="button" data-layout="list" aria-label="Lista"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="3" width="4" height="4" rx="1"/><path d="M9 5h8.5"/><rect x="2.5" y="8" width="4" height="4" rx="1"/><path d="M9 10h8.5"/><rect x="2.5" y="13" width="4" height="4" rx="1"/><path d="M9 15h8.5"/></svg></button><button type="button" data-layout="board" aria-label="Quadro"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="2.5" width="4" height="15" rx="1"/><rect x="8" y="2.5" width="4" height="10" rx="1"/><rect x="13.5" y="2.5" width="4" height="12.5" rx="1"/></svg></button></div></div>
      </div>
      <div class="nb-body" id="nbBody"><div class="nb-inner" id="nbInner"><div class="nb-grid grid" id="nbGrid" data-l="grid"></div></div></div>
    </div>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detalhe" tabindex="-1">
      <div class="grab" id="grab" role="button" tabindex="0" aria-label="Alternar entre meio ecrã e ecrã inteiro"><span></span></div>
      <button class="close" id="sClose" type="button" aria-label="Fechar"></button>
      <div class="sheet-body" id="sheetBody"><div class="sheet-inner" id="sheetInner"></div></div>
    </div>

    <div class="orb-wrap" id="orbWrap"><span class="orb-ground"></span><button class="orb" id="orb" type="button" aria-label="Abrir conversa"><span class="sphere"></span><span class="glint"></span><span class="spec"></span></button></div>

    <div class="chat" id="chat">
      <div class="chat-bg"></div>
      <div class="chat-inner" id="chatInner">
        <div class="answer" id="answer"><div class="ans-body" id="ansBody"></div></div>
        <p class="sr" id="live" aria-live="polite"></p>
        <form class="composer" id="composer" autocomplete="off">
          <input id="chatInput" type="text" aria-label="Mensagem" enterkeyhint="send">
          <button class="send" type="submit" aria-label="Enviar"></button>
        </form>
      </div>
    </div>

    <div class="stories" id="stories" role="dialog" aria-modal="true" aria-label="Stories" tabindex="-1"></div>
  </div>
</div>

<script src="ui.js"></script>
<script src="interaction.js"></script>
