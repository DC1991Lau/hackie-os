<title>Orb Gesture Prototype</title>
<style>
/* Layout: one phone-sized stage. On phones the device fills the screen; on wider screens it sits centred in a frame. Lo-fi wireframe: black, white and greys only. */
:root{
  --stage:#e4e4e4;
  --ink:#ffffff;
  --sheet:#ffffff;
  --card:#ffffff;
  --fg:#111111;
  --line:#111111;
  --fill:#f0f0f0;
  --bone:#d6d6d6;
  --bone-strong:#9a9a9a;
  --grid:rgba(0,0,0,.09);
  --veil:rgba(255,255,255,.55);
  --scrim:rgba(0,0,0,.35);
  --shadow:rgba(0,0,0,.18);
  --frame:#1a1a1a;
  --frame-edge:#3a3a3a;
  --g1:#111111;
  --g2:#555555;
  --g3:#8f8f8f;
  --g4:#c8c8c8;
  --r-card:22px;
  --app-r:30px;
  --kb:0px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --stage:#1c1c1c;--ink:#000000;--sheet:#0d0d0d;--card:#0d0d0d;--fg:#f2f2f2;--line:#f2f2f2;--fill:#1a1a1a;
  --bone:#333333;--bone-strong:#777777;--grid:rgba(255,255,255,.10);--veil:rgba(0,0,0,.55);--scrim:rgba(0,0,0,.6);
  --shadow:rgba(0,0,0,.6);--frame:#2c2c2c;--frame-edge:#4a4a4a;--g1:#f2f2f2;--g2:#b5b5b5;--g3:#7a7a7a;--g4:#454545;color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#1c1c1c;--ink:#000000;--sheet:#0d0d0d;--card:#0d0d0d;--fg:#f2f2f2;--line:#f2f2f2;--fill:#1a1a1a;
  --bone:#333333;--bone-strong:#777777;--grid:rgba(255,255,255,.10);--veil:rgba(0,0,0,.55);--scrim:rgba(0,0,0,.6);
  --shadow:rgba(0,0,0,.6);--frame:#2c2c2c;--frame-edge:#4a4a4a;--g1:#f2f2f2;--g2:#b5b5b5;--g3:#7a7a7a;--g4:#454545;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--fg);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
.stage{height:100%;display:grid;place-items:center}
.device{position:relative;overflow:hidden;background:var(--ink);width:100%;height:100%;touch-action:none;isolation:isolate}
@media (min-width:560px){
  :root{--app-r:50px}
  .device{width:auto;height:min(844px,calc(100% - 48px));aspect-ratio:390/844;max-width:100%;border-radius:52px;
    box-shadow:0 0 0 10px var(--frame),0 0 0 11px var(--frame-edge),0 50px 90px -20px var(--shadow)}
}

/* image placeholder: grey box with a cross */
.ph{background:
  linear-gradient(to top right,transparent calc(50% - 1px),var(--bone-strong) calc(50% - 1px),var(--bone-strong) calc(50% + 1px),transparent calc(50% + 1px)),
  linear-gradient(to bottom right,transparent calc(50% - 1px),var(--bone-strong) calc(50% - 1px),var(--bone-strong) calc(50% + 1px),transparent calc(50% + 1px)),
  var(--fill)}

/* shared background: a dot grid that never moves with the pages */
.bg{position:absolute;inset:-40px;z-index:0;will-change:transform;
  background-image:radial-gradient(var(--grid) 1.2px,transparent 1.4px);background-size:22px 22px}

/* app layer (scales back when sheets/stories open) */
.app{position:absolute;inset:0;z-index:1;transform-origin:50% 45%;will-change:transform;overflow:hidden;background:transparent}
.status{position:absolute;top:16px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:center;z-index:3;pointer-events:none}
.status i{display:block;height:10px;border-radius:6px;background:var(--fg)}
.status .r{display:flex;gap:6px}
.pull-hint{position:absolute;top:42px;left:50%;height:5px;width:36px;margin-left:-18px;border-radius:3px;background:var(--bone-strong);z-index:3;pointer-events:none}

.pager{position:absolute;inset:0;z-index:2}
.track{display:flex;height:100%;will-change:transform}
.view{flex:0 0 100%;height:100%;padding:68px 18px 150px;display:flex;flex-direction:column;gap:14px;overflow:hidden}

/* floating lo-fi components */
.c{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-card);
  box-shadow:0 14px 28px -18px var(--shadow);cursor:pointer;
  transform:translate3d(calc(var(--o,0) * var(--d,0) * 90px),0,0);
  opacity:calc(1 - var(--ao,0) * .5);
  transition:scale .25s cubic-bezier(.2,.9,.25,1);
  animation:float 6s ease-in-out infinite;animation-delay:calc(var(--fd,0s) * -1)}
.c.press{scale:.965}
@keyframes float{50%{translate:0 -5px}}
.rows{display:flex;flex-direction:column;gap:9px;min-width:0;flex:1}
.b{display:block;height:10px;border-radius:6px;background:var(--bone)}
.b.s{height:13px;background:var(--bone-strong)}
.dot{flex:none;width:44px;height:44px;border-radius:50%;background:var(--fill);border:1.5px solid var(--line)}
.dot.sm{width:36px;height:36px}
.chip{flex:none;width:46px;height:24px;border-radius:12px;border:1.5px solid var(--line)}
.chev{flex:none;width:28px;height:28px;border-radius:50%;background:var(--bone)}

.hero{height:230px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;overflow:hidden}
.hero .art{position:absolute;left:12px;right:12px;top:12px;bottom:76px;border-radius:14px}
.hero .orbit,.hero .moon{display:none}
.hero .rows{position:relative;flex:none;width:70%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sq{aspect-ratio:1;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.pill{height:72px;border-radius:36px;padding:0 16px 0 18px;display:flex;align-items:center;gap:14px}

.head{display:flex;flex-direction:column;gap:9px;padding:6px 4px 4px}
.head .b{background:var(--bone-strong)}
.row{height:76px;padding:0 16px;display:flex;align-items:center;gap:14px;border-radius:24px}

.mason{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col{display:flex;flex-direction:column;gap:14px}
.tall{height:220px;padding:12px;display:flex;flex-direction:column;gap:12px}
.short{height:130px;padding:12px;display:flex;flex-direction:column;gap:12px}
.tile-art{flex:1;border-radius:12px}
.tall .rows,.short .rows{flex:none;padding:0 4px 4px}
.wide{height:96px;padding:0 18px;display:flex;align-items:center;gap:14px}
.wide .stack{display:flex}
.wide .stack span{width:40px;height:40px;border-radius:50%;margin-right:-12px;border:3px solid var(--card)}

.ring{height:260px;display:grid;place-items:center}
.ring svg{width:170px;height:170px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:16;stroke-linecap:round}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{height:130px;padding:14px 12px;display:flex;flex-direction:column;justify-content:space-between}
.spark{display:flex;align-items:flex-end;gap:4px;height:46px}
.spark i{flex:1;border-radius:3px;background:var(--bone-strong)}

.dots{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);display:flex;gap:6px;z-index:3;pointer-events:none}
.dots i{display:block;height:6px;width:6px;border-radius:3px;background:var(--fg)}

/* orb */
.orb-wrap{position:absolute;left:50%;bottom:28px;z-index:5;transform:translate3d(-50%,0,0);will-change:transform}
.orb{position:relative;width:68px;height:68px;border-radius:50%;border:0;padding:0;cursor:pointer;background:transparent;
  transition:transform .45s cubic-bezier(.2,.9,.25,1),opacity .3s;animation:breathe 4.5s ease-in-out infinite}
.orb::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:1.5px dashed var(--fg);opacity:.45;animation:spin 14s linear infinite}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--fg);box-shadow:0 10px 24px -8px var(--shadow)}
.orb:active{transform:scale(.9)}
.orb:focus-visible{outline:2px solid var(--fg);outline-offset:12px}
@keyframes breathe{50%{scale:1.05}}
@keyframes spin{to{transform:rotate(360deg)}}

/* chat overlay */
.chat{position:absolute;inset:0;z-index:6;pointer-events:none}
.chat-bg{position:absolute;inset:0;background:var(--veil);-webkit-backdrop-filter:blur(14px) grayscale(1);backdrop-filter:blur(14px) grayscale(1);
  opacity:0;transition:opacity .4s ease}
.chat-inner{position:absolute;inset:0;transform:translate3d(0,24px,0);opacity:0;transition:transform .45s cubic-bezier(.2,.9,.25,1),opacity .3s}
.thread{position:absolute;left:16px;right:16px;top:64px;bottom:calc(28px + 68px + 18px + var(--kb));display:flex;flex-direction:column;justify-content:flex-end;gap:10px;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 22%);mask-image:linear-gradient(to bottom,transparent,#000 22%);transition:bottom .25s}
.bubble{max-width:74%;padding:14px 16px;border-radius:22px;display:flex;flex-direction:column;gap:8px;animation:pop .45s cubic-bezier(.2,.9,.25,1) both}
.bubble.me{align-self:flex-end;background:var(--fg);border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--card);border:1.5px solid var(--line);border-bottom-left-radius:6px}
.bubble .ln{display:block;height:9px;border-radius:5px;background:var(--bone-strong)}
.bubble.me .ln{background:var(--ink);opacity:.55}
.bubble.typing{flex-direction:row;gap:5px;padding:16px 18px}
.bubble.typing i{width:8px;height:8px;border-radius:50%;background:var(--bone-strong);animation:bob 1s ease-in-out infinite}
.bubble.typing i:nth-child(2){animation-delay:.15s}.bubble.typing i:nth-child(3){animation-delay:.3s}
@keyframes pop{from{opacity:0;transform:translate3d(0,14px,0) scale(.94)}}
@keyframes bob{50%{transform:translateY(-5px);opacity:.5}}
.composer{position:absolute;left:16px;right:16px;bottom:calc(28px + var(--kb));height:68px;margin:0;border-radius:34px;
  display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;
  background:var(--card);border:1.5px solid var(--line);box-shadow:0 16px 30px -18px var(--shadow);
  clip-path:inset(0 calc(50% - 34px) round 34px);transition:clip-path .5s cubic-bezier(.2,.9,.25,1),bottom .25s}
.composer > *{opacity:0;transition:opacity .2s}
.mini-orb{flex:none;width:40px;height:40px;border-radius:50%;background:var(--fg)}
.composer input{flex:1;min-width:0;height:44px;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:16px;caret-color:var(--fg)}
.send{flex:none;width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;background:var(--fg);position:relative}
.send::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-4px 0 0 -6px;border-left:3px solid var(--ink);border-top:3px solid var(--ink);transform:rotate(45deg)}
.send:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

.device.chat-open .chat{pointer-events:auto}
.device.chat-open .chat-bg{opacity:1}
.device.chat-open .chat-inner{transform:none;opacity:1}
.device.chat-open .composer{clip-path:inset(0 0 round 34px)}
.device.chat-open .composer > *{opacity:1;transition-delay:.18s}
.device.chat-open .orb{transform:scale(.7);opacity:0;pointer-events:none}

/* bottom sheet */
.scrim{position:absolute;inset:0;z-index:7;background:var(--scrim);opacity:0;pointer-events:none}
.scrim.on{pointer-events:auto}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;top:56px;z-index:8;border-radius:34px;background:var(--sheet);
  border:1.5px solid var(--line);box-shadow:0 -10px 50px -10px var(--shadow);overflow:hidden;visibility:hidden;will-change:transform}
.grab{height:30px;display:grid;place-items:center}
.grab span{width:40px;height:5px;border-radius:3px;background:var(--bone-strong)}
.sheet-body{position:absolute;top:30px;left:0;right:0;bottom:0;overflow:hidden}
.sheet-inner{padding:4px 16px 32px;display:flex;flex-direction:column;gap:14px;will-change:transform}
.s-hero{height:190px;border-radius:20px}
.s-head{display:flex;align-items:center;gap:14px;padding:4px 2px}
.s-btn{flex:none;width:84px;height:40px;border-radius:20px;background:var(--fg)}
.chips{display:flex;gap:8px}
.chips i{height:34px;border-radius:17px;border:1.5px solid var(--line)}
.s-row{height:68px;border-radius:18px;border:1.5px solid var(--bone);display:flex;align-items:center;gap:14px;padding:0 14px}
.s-row .sq-ic{flex:none;width:40px;height:40px;border-radius:10px}
.s-block{height:150px;border-radius:20px}

/* stories */
.stories{position:absolute;inset:0;z-index:9;background:var(--ink);overflow:hidden;visibility:hidden;pointer-events:none;
  transform-origin:50% 25%;perspective:1100px;will-change:transform,opacity}
.stories.live{pointer-events:auto}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--ink)}
.slide{position:absolute;inset:0;display:none;background:color-mix(in srgb,var(--fg) var(--t,10%),var(--ink))}
.slide.on{display:block}
.slide .s1{position:absolute;border-radius:50%;border:1.5px solid var(--line);background:var(--card)}
.slide .s2{position:absolute;border-radius:24px;border:1.5px solid var(--line);box-shadow:0 30px 60px -20px var(--shadow)}
.slide .s3{position:absolute;left:24px;bottom:120px;display:flex;flex-direction:column;gap:10px;width:62%}
.slide .s3 i{display:block;height:14px;border-radius:7px;background:var(--fg)}
.slide .s3 i+i{height:11px;background:var(--bone-strong)}
.slide .g4{position:absolute;left:40px;right:40px;top:22%;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slide .g4 i{aspect-ratio:1;border-radius:18px;border:1.5px solid var(--line)}
.chrome{position:absolute;left:0;right:0;top:0;padding:14px 10px 40px;transition:opacity .2s}
.bars{display:flex;gap:4px}
.bars span{flex:1;height:3px;border-radius:2px;background:var(--bone);overflow:hidden}
.bars b{display:block;height:100%;width:0;background:var(--fg)}
.who{display:flex;align-items:center;gap:10px;margin-top:12px;padding:0 4px}
.who .av{width:34px;height:34px;border-radius:50%;border:2px solid var(--fg);background:var(--fill)}
.who i{display:block;height:10px;border-radius:5px;background:var(--fg)}
.who i+i{background:var(--bone-strong)}
.who .x{margin-left:auto;width:34px;height:34px;border-radius:50%;position:relative;cursor:pointer}
.who .x::before,.who .x::after{content:"";position:absolute;left:8px;right:8px;top:16px;height:2px;border-radius:1px;background:var(--fg);transform:rotate(45deg)}
.who .x::after{transform:rotate(-45deg)}
.foot{position:absolute;left:14px;right:14px;bottom:24px;display:flex;gap:10px;align-items:center;transition:opacity .2s}
.foot .reply{flex:1;height:48px;border-radius:24px;border:1.5px solid var(--line)}
.foot .ic{width:30px;height:30px;border-radius:50%;border:2px solid var(--fg)}
.shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.stories.hold .chrome,.stories.hold .foot{opacity:0}

/* notebook (swipe up from the first view) */
.up-hint{position:absolute;left:50%;bottom:132px;width:14px;height:14px;margin-left:-7px;border-left:2px solid var(--bone-strong);border-top:2px solid var(--bone-strong);
  transform:rotate(45deg);z-index:3;pointer-events:none;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{50%{translate:0 -5px}}
.notebook{position:absolute;inset:0;z-index:4;visibility:hidden;pointer-events:none;transform-origin:50% 60%;will-change:transform,opacity}
.notebook.live{pointer-events:auto}
.nb-head{position:absolute;top:54px;left:18px;right:18px;display:flex;flex-direction:column;gap:14px}
.nb-top{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.nb-top .b{background:var(--fg)}
.nb-add{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);position:relative;background:var(--card)}
.nb-add::before,.nb-add::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:2px;margin:-1px 0 0 -7px;background:var(--fg);border-radius:1px}
.nb-add::after{transform:rotate(90deg)}
.nb-bar{display:flex;gap:10px;align-items:center}
.nb-search{flex:1;min-width:0;height:40px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);position:relative}
.nb-search .mag{position:absolute;left:14px;top:12px;width:13px;height:13px;border-radius:50%;border:2px solid var(--bone-strong)}
.nb-tools{flex:none;display:flex;gap:2px;padding:3px;border-radius:21px;border:1.5px solid var(--line);background:var(--card)}
.nb-tools button{width:36px;height:32px;border:0;border-radius:16px;background:transparent;color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0;transition:background .25s,color .25s}
.nb-tools button.on{background:var(--fg);color:var(--ink)}
.nb-tools button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.nb-tools svg{width:18px;height:18px;pointer-events:none}
.nb-body{position:absolute;top:150px;left:0;right:0;bottom:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 14px);mask-image:linear-gradient(to bottom,transparent,#000 14px)}
.nb-inner{padding:8px 18px 130px;will-change:transform}
.nb-grid{display:grid;gap:10px;align-items:start}
.nb-grid.grid{grid-template-columns:repeat(3,1fr)}
.nb-grid.cards{grid-template-columns:repeat(2,1fr);gap:12px}
.nb-grid.list{grid-template-columns:1fr;gap:8px}
.nb-grid.board{display:block;column-count:3;column-gap:8px}
.nb-card{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:8px;
  overflow:hidden;min-width:0;cursor:pointer;transition:scale .2s cubic-bezier(.2,.9,.25,1),box-shadow .2s}
.nb-card .t{flex:1;min-height:0;border-radius:9px}
.nb-card .cd{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line)}
.nb-card .rows{flex:none;gap:6px;margin-top:auto}
.nb-card .b{height:7px}.nb-card .b.s{height:9px}
.nb-card.lift{z-index:5;scale:1.06;box-shadow:0 24px 40px -14px var(--shadow)}
.grid .nb-card{aspect-ratio:1}
.grid .nb-card .rows .b:nth-child(n+3){display:none}
.cards .nb-card{height:190px;padding:10px}
.cards .nb-card.k1{height:130px}
.list .nb-card{flex-direction:row;align-items:center;height:64px;padding:10px;gap:12px;border-radius:18px}
.list .nb-card .t{flex:none;width:42px;height:42px}
.list .nb-card .cd{width:42px;height:42px}
.list .nb-card .rows{flex:1;margin:0}
.list .nb-card.k1::before{content:"";flex:none;width:42px;height:42px;border-radius:9px;border:1.5px dashed var(--bone-strong)}
.board .nb-card{break-inside:avoid;margin-bottom:8px;height:150px}
.board .nb-card.k1{height:96px}
.board .nb-card.k2{height:112px}

@media (prefers-reduced-motion:reduce){
  .c,.orb,.orb::before,.up-hint{animation:none}
  .composer,.chat-inner,.chat-bg{transition-duration:.01s}
}
</style>

<div class="stage">
  <div class="device" id="device">
    <div class="bg" id="bg"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

    <div class="app" id="app">
      <div class="status"><i style="width:42px"></i><span class="r"><i style="width:18px"></i><i style="width:16px"></i><i style="width:26px"></i></span></div>
      <div class="pull-hint" id="pullHint"></div>
      <div class="pager" id="pager"><div class="track" id="track"></div></div>
      <div class="dots" id="dots"></div>
      <div class="up-hint" id="upHint"></div>
    </div>

    <div class="notebook" id="notebook">
      <div class="nb-head">
        <div class="nb-top"><i class="b s" style="width:38%;height:16px"></i><span class="nb-add"></span></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const device=$('#device'), app=$('#app'), bg=$('#bg'), pager=$('#pager'), track=$('#track'), dotsEl=$('#dots');
const orb=$('#orb'), orbWrap=$('#orbWrap'), pullHint=$('#pullHint'), upHint=$('#upHint');
const chat=$('#chat'), chatInner=$('#chatInner'), thread=$('#thread'), composer=$('#composer'), input=$('#chatInput');
const scrim=$('#scrim'), sheet=$('#sheet'), sheetBody=$('#sheetBody'), sheetInner=$('#sheetInner');
const storiesEl=$('#stories');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let W=0,H=0;

/* ---------- physics ---------- */
function spring({from,to,velocity=0,stiffness=320,damping=34,rest=[0.4,6],onUpdate,onDone}){
  let x=from,v=velocity,last=performance.now(),id=0,stopped=false;
  if(reduce){onUpdate(to);onDone&&onDone();return{stop(){}};}
  const step=now=>{
    if(stopped)return;
    const dt=Math.min(0.05,(now-last)/1000);last=now;
    const n=Math.max(1,Math.ceil(dt/0.004)),h=dt/n;
    for(let i=0;i<n;i++){const a=-stiffness*(x-to)-damping*v;v+=a*h;x+=v*h;}
    if(Math.abs(x-to)<rest[0]&&Math.abs(v)<rest[1]){onUpdate(to);onDone&&onDone();return;}
    onUpdate(x);id=requestAnimationFrame(step);
  };
  id=requestAnimationFrame(step);
  return{stop(){stopped=true;cancelAnimationFrame(id);}};
}
const rubber=(d,dim)=>Math.sign(d)*(1-1/(Math.abs(d)*0.55/dim+1))*dim;

function gesture(el,o){
  let s=null;
  el.addEventListener('pointerdown',e=>{
    if(e.button>0||s)return;
    if(o.shouldStart&&o.shouldStart(e)===false)return;
    s={id:e.pointerId,x0:e.clientX,y0:e.clientY,lx:e.clientX,ly:e.clientY,axis:null,target:e.target,pressed:false,pts:[]};
    s.pts.push([e.clientX,e.clientY,e.timeStamp]);
    try{el.setPointerCapture(e.pointerId);}catch(_){}
    o.onDown&&o.onDown(s);
    if(o.onPress){const me=s;s.timer=setTimeout(()=>{if(s===me&&!me.axis){me.pressed=true;o.onPress(me);}},o.pressDelay||200);}
  });
  el.addEventListener('pointermove',e=>{
    if(!s||e.pointerId!==s.id)return;
    const dx=e.clientX-s.x0,dy=e.clientY-s.y0,ddx=e.clientX-s.lx,ddy=e.clientY-s.ly;
    s.lx=e.clientX;s.ly=e.clientY;
    s.pts.push([e.clientX,e.clientY,e.timeStamp]);
    while(s.pts.length>2&&e.timeStamp-s.pts[0][2]>90)s.pts.shift();
    if(!s.axis){
      if(Math.hypot(dx,dy)<8)return;
      s.axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
      clearTimeout(s.timer);
      if(o.onAxis&&o.onAxis(s.axis,dx,dy,s)===false)s.axis='none';
    }
    if(s.axis!=='none'&&o.onMove)o.onMove({dx,dy,ddx,ddy,axis:s.axis},s);
  });
  const end=e=>{
    if(!s||e.pointerId!==s.id)return;
    clearTimeout(s.timer);
    const st=s;s=null;
    const a=st.pts[0],b=st.pts[st.pts.length-1],dt=Math.max(1,b[2]-a[2])/1000;
    const vx=(b[0]-a[0])/dt,vy=(b[1]-a[1])/dt;
    o.onUp&&o.onUp(st);
    if(st.pressed&&o.onPressEnd)o.onPressEnd(st);
    if(!st.axis){if(!st.pressed&&e.type==='pointerup'&&o.onTap)o.onTap(st.target,e,st);return;}
    if(st.axis==='none')return;
    o.onEnd&&o.onEnd({dx:e.clientX-st.x0,dy:e.clientY-st.y0,vx,vy,axis:st.axis},st);
  };
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
}

/* ---------- views (wireframe only) ---------- */
const ACC=['g1','g2','g3','g4'];
const b=(w,s)=>`<i class="b${s?' s':''}" style="width:${w}%"></i>`;
const card=(cls,acc,d,inner)=>`<div class="c ${cls}" data-accent="${acc}" style="--d:${d};--a:var(--${acc});--fd:${(d*3.1).toFixed(2)}s">${inner}</div>`;
const spark=()=>`<div class="spark">${[40,70,55,90,65].map(h=>`<i style="height:${h}%"></i>`).join('')}</div>`;
const VIEWS=[
  card('hero','g1',.12,`<div class="art ph"></div><span class="orbit"></span><span class="moon"></span><div class="rows">${b(55,1)}${b(80)}</div>`)+
  `<div class="grid2">${card('sq','g2',.4,`<span class="dot"></span><div class="rows" style="flex:none">${b(70,1)}${b(45)}</div>`)}${card('sq','g3',.58,`<span class="dot"></span><div class="rows" style="flex:none">${b(60,1)}${b(80)}</div>`)}</div>`+
  card('pill','g4',.85,`<span class="dot sm"></span><div class="rows">${b(55,1)}</div><span class="chev"></span>`),

  `<div class="head">${b(42,1)}${b(24)}</div>`+
  [[62,40],[48,70],[70,35],[55,60],[40,52]].map((w,i)=>card('row',ACC[i%4],.15+i*.17,`<span class="dot"></span><div class="rows">${b(w[0],1)}${b(w[1])}</div><span class="chip"></span>`)).join(''),

  `<div class="mason"><div class="col">${card('tall','g3',.15,`<div class="tile-art ph"></div><div class="rows">${b(75,1)}${b(50)}</div>`)}${card('short','g4',.5,`<div class="tile-art ph"></div><div class="rows">${b(60,1)}</div>`)}</div>`+
  `<div class="col">${card('short','g2',.3,`<div class="tile-art ph"></div><div class="rows">${b(65,1)}</div>`)}${card('tall','g1',.65,`<div class="tile-art ph"></div><div class="rows">${b(80,1)}${b(45)}</div>`)}</div></div>`+
  card('wide','g1',.9,`<span class="stack"><span style="background:var(--g1)"></span><span style="background:var(--g2)"></span><span style="background:var(--g3)"></span></span><div class="rows" style="margin-left:16px">${b(60,1)}${b(35)}</div>`),

  card('ring','g3',.15,`<svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="54" style="stroke:var(--bone)"></circle>
    <circle cx="70" cy="70" r="54" style="stroke:var(--g1)" stroke-dasharray="120 400"></circle>
    <circle cx="70" cy="70" r="54" style="stroke:var(--g2)" stroke-dasharray="70 400" stroke-dashoffset="-136"></circle>
    <circle cx="70" cy="70" r="54" style="stroke:var(--g3)" stroke-dasharray="60 400" stroke-dashoffset="-222"></circle></svg>`)+
  `<div class="grid3">${['g4','g2','g1'].map((a,i)=>card('stat',a,.4+i*.2,`<div class="rows" style="flex:none">${b(70,1)}${b(45)}</div>${spark()}`)).join('')}</div>`+
  card('pill','g2',.95,`<span class="dot sm"></span><div class="rows">${b(48,1)}</div><span class="chev"></span>`)
];
track.innerHTML=VIEWS.map(v=>`<section class="view">${v}</section>`).join('');
const views=[...track.children],N=views.length;
dotsEl.innerHTML='<i></i>'.repeat(N);
const dots=[...dotsEl.children];

/* ---------- shared app transform ---------- */
let sheetK=0;
const pg={index:0,x:0,base:0,start:0,anim:null};
const st={open:0,pull:0,dragY:0,closing:false,g:0,seg:[],elapsed:0,cubeX:0,paused:false,dragging:false,cubeAnim:null,dAnim:null,pAnim:null};
function renderApp(){
  const stK=Math.min(st.open,1)*(1-Math.min(st.dragY/(H*0.7),1));
  const n=Math.min(nb.p,1);
  const s=(1-0.07*sheetK-0.08*stK)*(1-0.08*n);
  app.style.transform=`translate3d(0,${st.pull*0.3+sheetK*8-n*70}px,0) scale(${s})`;
  app.style.opacity=1-n;
  app.style.borderRadius=(sheetK>0.005||stK>0.005||st.pull>0||n>0.005)?'var(--app-r)':'';
  notebook.style.visibility=nb.p<=0.001?'hidden':'visible';
  notebook.style.transform=`translate3d(0,${(1-n)*H*0.3+sheetK*8}px,0) scale(${(0.94+0.06*n)*(1-0.07*sheetK)})`;
  notebook.style.opacity=n;
  notebook.classList.toggle('live',nb.open);
  const hide=Math.max(sheetK,stK);
  orbWrap.style.transform=`translate3d(-50%,${hide*150}px,0)`;
  orbWrap.style.opacity=1-hide;
  dotsEl.style.opacity=1-hide;
  pullHint.style.width=(36+Math.min(st.pull,200)*0.35)+'px';
  pullHint.style.marginLeft=-(18+Math.min(st.pull,200)*0.175)+'px';
}

/* ---------- pager ---------- */
function renderPager(){
  track.style.transform=`translate3d(${pg.x}px,0,0)`;
  const pos=-pg.x/(W||1);
  views.forEach((v,i)=>{const o=i-pos;v.style.setProperty('--o',o.toFixed(4));v.style.setProperty('--ao',Math.min(1,Math.abs(o)).toFixed(4));v.style.visibility=Math.abs(o)>1.05?'hidden':'visible';});
  bg.style.transform=`translate3d(${-pos*14}px,0,0)`;
  upHint.style.opacity=Math.max(0,1-Math.abs(pos)*1.5);
  dots.forEach((d,i)=>{const a=Math.max(0,1-Math.abs(i-pos));d.style.width=(6+14*a)+'px';d.style.opacity=.3+.7*a;});
}
function pagerTo(t,v=0){
  pg.index=t;pg.anim&&pg.anim.stop();
  pg.anim=spring({from:pg.x,to:-t*W,velocity:v,stiffness:300,damping:33,onUpdate:x=>{pg.x=x;renderPager();},onDone:()=>pg.anim=null});
}
let pressed=null;
const PULL=260;
gesture(pager,{
  onDown(s){pg.anim&&pg.anim.stop();pg.anim=null;pressed=s.target.closest('.c');pressed&&pressed.classList.add('press');},
  onUp(){pressed&&pressed.classList.remove('press');pressed=null;},
  onAxis(axis,dx,dy){
    pressed&&pressed.classList.remove('press');
    if(axis==='x'){pg.base=pg.x;pg.start=Math.round(-pg.x/W);return true;}
    if(dy>0){st.pAnim&&st.pAnim.stop();resetStoriesState();pg.v='stories';return true;}
    if(pg.index===0&&Math.abs(pg.x)<1){nb.anim&&nb.anim.stop();pg.v='nb';return true;}
    return false;
  },
  onMove({dx,dy,axis}){
    if(axis==='x'){
      let x=pg.base+dx;const min=-(N-1)*W;
      if(x>0)x=rubber(x,W);else if(x<min)x=min-rubber(min-x,W);
      pg.x=x;renderPager();
    }else if(pg.v==='nb'){
      const u=Math.max(0,-dy);nb.p=Math.min(1,u/NBD());renderApp();
    }else{
      const d=Math.max(0,dy);
      st.pull=d<PULL?d:PULL+(d-PULL)*0.3;
      st.open=Math.min(st.pull/PULL,1);
      renderStories();
    }
  },
  onEnd({vx,vy,axis}){
    if(axis==='x'){
      const proj=-(pg.x+vx*0.2)/W;
      pagerTo(clamp(Math.round(proj),Math.max(0,pg.start-1),Math.min(N-1,pg.start+1)),vx);
    }else if(pg.v==='nb'){
      nbTo(nb.p>0.35||vy<-700?1:0,-vy/NBD());
    }else{
      const open=st.pull>PULL*0.42||vy>700;
      st.pAnim=spring({from:st.pull,to:open?PULL:0,velocity:vy,stiffness:280,damping:30,
        onUpdate:p=>{st.pull=p;st.open=Math.min(p/PULL,1);renderStories();},
        onDone:()=>{st.pull=0;st.open=open?1:0;renderStories();}});
    }
  },
  onTap(target){const c=target.closest('.c');if(c)openSheet(c.dataset.accent);}
});

/* ---------- bottom sheet ---------- */
sheetInner.innerHTML=`<div class="s-hero ph"></div>
  <div class="s-head"><span class="dot" style="--a:var(--a)"></span><div class="rows">${b(62,1)}${b(38)}</div><span class="s-btn"></span></div>
  <div class="chips"><i style="width:70px"></i><i style="width:92px"></i><i style="width:60px"></i><i style="width:80px"></i></div>
  ${[70,50,64,42,58,74,46,60].map((w,i)=>`<div class="s-row"><span class="sq-ic ph"></span><div class="rows">${b(w,1)}${b(w-20)}</div></div>`).join('')}
  <div class="s-block ph"></div><div class="s-block ph"></div>`;
const sh={ty:0,scroll:0,anim:null,mom:0,mode:'sheet',state:'closed'};
let FULL=0,HALF=0,CLOSED=0;
function sheetGeom(){const SH=sheet.offsetHeight;FULL=0;HALF=Math.max(0,SH-H*0.5);CLOSED=SH+30;}
const maxScroll=()=>Math.max(0,sheetInner.offsetHeight-sheetBody.clientHeight);
function renderSheet(){
  sheet.style.transform=`translate3d(0,${sh.ty}px,0)`;
  sheetInner.style.transform=`translate3d(0,${-sh.scroll}px,0)`;
  const k1=clamp((CLOSED-sh.ty)/(CLOSED-HALF||1),0,1),k2=clamp((HALF-sh.ty)/(HALF-FULL||1),0,1);
  sheetK=k1*0.6+k2*0.4;
  scrim.style.opacity=k1*0.7+k2*0.3;
  sheet.style.visibility=sh.ty>=CLOSED-1?'hidden':'visible';
  renderApp();
}
function sheetTo(to,v=0){
  sh.anim&&sh.anim.stop();cancelAnimationFrame(sh.mom);
  sh.state=to===FULL?'full':to===HALF?'half':'closed';
  scrim.classList.toggle('on',to!==CLOSED);
  sh.anim=spring({from:sh.ty,to,velocity:v,stiffness:380,damping:36,onUpdate:y=>{sh.ty=y;renderSheet();},
    onDone:()=>{sh.anim=null;if(to===CLOSED)sh.scroll=0;}});
}
function openSheet(acc){
  sheet.style.setProperty('--a',`var(--${acc})`);
  sh.scroll=0;sh.ty=CLOSED;renderSheet();sheetTo(HALF);
}
const closeSheet=()=>sheetTo(CLOSED);
scrim.addEventListener('click',closeSheet);
function momentum(v){
  cancelAnimationFrame(sh.mom);let last=performance.now();const max=maxScroll();
  const f=now=>{const dt=Math.min(32,now-last);last=now;sh.scroll+=v*dt/1000;v*=Math.pow(0.996,dt);
    if(sh.scroll<0){sh.scroll=0;v=0;}if(sh.scroll>max){sh.scroll=max;v=0;}
    renderSheet();if(Math.abs(v)>15&&!reduce)sh.mom=requestAnimationFrame(f);};
  sh.mom=requestAnimationFrame(f);
}
gesture(sheet,{
  onDown(){sh.anim&&sh.anim.stop();sh.anim=null;cancelAnimationFrame(sh.mom);},
  onAxis:axis=>axis==='y',
  onMove({ddy}){
    let d=ddy;const max=maxScroll();
    if(d<0){
      if(sh.ty>FULL){const use=Math.max(d,FULL-sh.ty);sh.ty+=use;d-=use;sh.mode='sheet';}
      if(d<0&&sh.scroll<max){sh.scroll=Math.min(max,sh.scroll-d);sh.mode='scroll';}
    }else if(d>0){
      if(sh.scroll>0){const use=Math.min(d,sh.scroll);sh.scroll-=use;d-=use;sh.mode='scroll';}
      if(d>0){sh.ty+=d;sh.mode='sheet';}
    }
    renderSheet();
  },
  onEnd({vy}){
    if(sh.mode==='scroll'&&sh.ty<=FULL+0.5){sh.state='full';momentum(-vy);return;}
    const proj=sh.ty+vy*0.2;
    const to=[FULL,HALF,CLOSED].reduce((a,c)=>Math.abs(c-proj)<Math.abs(a-proj)?c:a);
    sheetTo(to,vy);
  }
});

/* ---------- chat overlay ---------- */
let chatOpen=false;
function openChat(){
  if(chatOpen)return;chatOpen=true;device.classList.add('chat-open');
  input.value='';input.focus({preventScroll:true});
  if(!thread.children.length)setTimeout(aiReply,380);
}
function closeChat(){
  if(!chatOpen)return;chatOpen=false;input.blur();
  chatInner.style.transform='';chatInner.style.transition='';chat.firstElementChild.style.opacity='';
  device.classList.remove('chat-open');
}
orb.addEventListener('click',openChat);
function bubble(kind,lines){
  const el=document.createElement('div');el.className='bubble '+kind;
  el.innerHTML=lines.map(w=>`<i class="ln" style="width:${w}px"></i>`).join('');
  thread.appendChild(el);
  while(thread.children.length>14)thread.firstElementChild.remove();
  return el;
}
const rnd=(a,b)=>Math.round(a+Math.random()*(b-a));
function aiReply(){
  const t=document.createElement('div');t.className='bubble ai typing';t.innerHTML='<i></i><i></i><i></i>';
  thread.appendChild(t);
  setTimeout(()=>{t.remove();const n=rnd(2,4);bubble('ai',Array.from({length:n},(_,i)=>i===n-1?rnd(60,120):rnd(150,210)));},900);
}
composer.addEventListener('submit',e=>{
  e.preventDefault();
  const len=input.value.trim().length,n=clamp(Math.ceil(len/28),1,3);
  bubble('me',Array.from({length:n},(_,i)=>i===n-1?clamp(40+len*4,60,190):190));
  input.value='';setTimeout(aiReply,420);
});
gesture(chat,{
  shouldStart:e=>chatOpen&&!e.target.closest('.composer'),
  onAxis:(axis,dx,dy)=>axis==='y'&&dy>0,
  onMove({dy}){const y=Math.max(0,dy);chatInner.style.transition='none';chatInner.style.transform=`translate3d(0,${y}px,0)`;chat.firstElementChild.style.opacity=1-Math.min(y/400,0.8);},
  onEnd({dy,vy}){
    if(dy>110||vy>700){closeChat();return;}
    chatInner.style.transition='';chatInner.style.transform='';chat.firstElementChild.style.opacity='';
  },
  onTap(target){if(!target.closest('.bubble'))closeChat();}
});
if(window.visualViewport){
  const kb=()=>{const v=visualViewport;const k=chatOpen?Math.max(0,innerHeight-v.height-v.offsetTop):0;device.style.setProperty('--kb',k+'px');};
  visualViewport.addEventListener('resize',kb);visualViewport.addEventListener('scroll',kb);
}

/* ---------- stories ---------- */
const SEGS=[3,2,4,3,2],G=SEGS.length,DUR=4500;
function slideHTML(gi,si){
  const tone=6+((gi*3+si*5)%5)*4;
  const v=(gi+si)%3;
  let inner='';
  if(v===0)inner=`<span class="s1" style="width:260px;height:260px;left:50%;top:26%;margin-left:-130px"></span><span class="s1" style="width:70px;height:70px;right:40px;top:18%"></span>`;
  else if(v===1)inner=`<span class="s2 ph" style="left:14%;right:14%;top:20%;height:46%;transform:rotate(-4deg)"></span><span class="s1" style="width:84px;height:84px;right:24px;top:58%"></span>`;
  else inner=`<div class="g4"><i class="ph"></i><i class="ph"></i><i class="ph"></i><i class="ph"></i></div>`;
  return `<div class="slide" style="--t:${tone}%">${inner}<div class="s3"><i style="width:${rnd(60,90)}%"></i><i style="width:${rnd(35,60)}%"></i></div></div>`;
}
storiesEl.innerHTML=SEGS.map((n,gi)=>`<div class="face">
  <div class="slides">${Array.from({length:n},(_,si)=>slideHTML(gi,si)).join('')}</div>
  <div class="chrome"><div class="bars">${'<span><b></b></span>'.repeat(n)}</div>
    <div class="who"><span class="av"></span><i style="width:${rnd(70,110)}px"></i><i style="width:28px"></i><span class="x"></span></div></div>
  <div class="foot"><span class="reply"></span><span class="ic"></span><span class="ic"></span></div>
  <div class="shade"></div></div>`).join('');
const faces=[...storiesEl.children];
function renderFace(i){
  const f=faces[i],seg=st.seg[i]||0;
  [...f.querySelectorAll('.slide')].forEach((s,j)=>s.classList.toggle('on',j===seg));
  [...f.querySelectorAll('.bars b')].forEach((bb,j)=>bb.style.width=j<seg?'100%':j>seg?'0%':(i===st.g?Math.min(100,st.elapsed/DUR*100):0)+'%');
}
function renderCube(){
  const pos=st.cubeX/(W||1);
  faces.forEach((f,i)=>{
    const o=i-pos;
    if(Math.abs(o)>=0.999){f.style.visibility='hidden';return;}
    f.style.visibility='visible';
    f.style.transformOrigin=o<0?'100% 50%':'0% 50%';
    f.style.transform=`translate3d(${o*100}%,0,0) rotateY(${o*90}deg)`;
    f.lastElementChild.style.opacity=Math.abs(o)*0.7;
  });
}
function renderStories(){
  const p=Math.min(st.open,1),y=st.dragY;
  storiesEl.style.visibility=p<=0.001?'hidden':'visible';
  const scale=(0.9+0.1*p)*(1-Math.min(y/H,1)*0.3);
  storiesEl.style.transform=`translate3d(0,${(p-1)*70+y*0.9}px,0) scale(${scale})`;
  storiesEl.style.opacity=Math.min(1,p*1.6)*(1-clamp((y-H*0.3)/(H*0.5),0,1));
  storiesEl.style.borderRadius=(p<1||y>0)?'var(--app-r)':'0px';
  storiesEl.classList.toggle('live',p>=1&&!st.closing);
  renderApp();
}
function resetStoriesState(){
  st.g=0;st.seg=SEGS.map(()=>0);st.elapsed=0;st.cubeX=0;st.dragY=0;st.closing=false;st.paused=false;
  storiesEl.classList.remove('hold');renderCube();faces.forEach((_,i)=>renderFace(i));
}
function closeStories(v=0){
  st.closing=true;st.dAnim&&st.dAnim.stop();
  st.dAnim=spring({from:st.dragY,to:H*1.1,velocity:Math.max(0,v),stiffness:200,damping:26,rest:[2,40],
    onUpdate:y=>{st.dragY=y;renderStories();},onDone:()=>{st.open=0;st.dragY=0;st.closing=false;renderStories();}});
}
function goGroup(t,v=0){
  st.g=t;st.elapsed=0;faces.forEach((_,i)=>renderFace(i));
  st.cubeAnim&&st.cubeAnim.stop();
  st.cubeAnim=spring({from:st.cubeX,to:t*W,velocity:v,stiffness:260,damping:32,onUpdate:x=>{st.cubeX=x;renderCube();},onDone:()=>st.cubeAnim=null});
}
function nextSeg(){
  const g=st.g;
  if(st.seg[g]<SEGS[g]-1){st.seg[g]++;st.elapsed=0;renderFace(g);}
  else if(g<G-1)goGroup(g+1);
  else closeStories();
}
function prevSeg(){
  const g=st.g;
  if(st.seg[g]>0){st.seg[g]--;st.elapsed=0;renderFace(g);}
  else if(g>0)goGroup(g-1);
  else{st.elapsed=0;renderFace(g);}
}
let cubeBase=0;
gesture(storiesEl,{
  shouldStart:()=>st.open>=1&&!st.closing,
  onDown(){st.dragging=true;},
  onUp(){st.dragging=false;},
  onPress(){st.paused=true;storiesEl.classList.add('hold');},
  onPressEnd(){st.paused=false;storiesEl.classList.remove('hold');},
  onAxis(axis,dx,dy){
    if(axis==='x'){st.cubeAnim&&st.cubeAnim.stop();cubeBase=st.cubeX;return true;}
    return dy>0;
  },
  onMove({dx,dy,axis}){
    if(axis==='x'){
      let x=cubeBase-dx;const max=(G-1)*W;
      if(x<0)x=-rubber(-x,W);else if(x>max)x=max+rubber(x-max,W);
      st.cubeX=x;renderCube();
    }else{st.dragY=Math.max(0,dy);renderStories();}
  },
  onEnd({dx,dy,vx,vy,axis}){
    if(axis==='x'){
      let t=st.g;
      if(dx<-W*0.25||vx<-500)t++;else if(dx>W*0.25||vx>500)t--;
      t=clamp(t,0,G-1);
      if(t!==st.g)goGroup(t,-vx);
      else{st.cubeAnim=spring({from:st.cubeX,to:t*W,velocity:-vx,stiffness:260,damping:32,onUpdate:x=>{st.cubeX=x;renderCube();},onDone:()=>st.cubeAnim=null});}
    }else{
      if(dy>120||vy>800)closeStories(vy);
      else{st.dAnim&&st.dAnim.stop();st.dAnim=spring({from:st.dragY,to:0,velocity:vy,stiffness:340,damping:32,onUpdate:y=>{st.dragY=y;renderStories();}});}
    }
  },
  onTap(target,e){
    if(target.closest('.x')){closeStories();return;}
    const r=storiesEl.getBoundingClientRect();
    (e.clientX-r.left<r.width*0.3)?prevSeg():nextSeg();
  }
});
let lastT=performance.now();
(function tick(now){
  const dt=now-lastT;lastT=now;
  if(st.open>=1&&!st.closing&&!st.paused&&!st.dragging&&!st.cubeAnim&&st.dragY===0){
    st.elapsed+=dt;
    if(st.elapsed>=DUR)nextSeg();else renderFace(st.g);
  }
  requestAnimationFrame(tick);
})(lastT);

/* ---------- notebook ---------- */
const notebook=$('#notebook'),nbBody=$('#nbBody'),nbInner=$('#nbInner'),nbGrid=$('#nbGrid');
const nb={p:0,open:false,anim:null,scroll:0,pull:0,mode:null,mom:0,lift:null};
const NBD=()=>H*0.42;
const KINDS=[0,1,2,0,0,1,2,0,1,0,2,0,1,0,0,2,1,0,2,0,1];
nbGrid.innerHTML=KINDS.map((k,i)=>{
  const top=k===0?'<div class="t ph"></div>':k===2?'<span class="cd"></span>':'';
  const rows=k===1?`${b(rnd(55,90),1)}${b(rnd(50,90))}${b(rnd(30,70))}`:`${b(rnd(45,85),1)}${b(rnd(30,60))}`;
  return `<div class="nb-card k${k}">${top}<div class="rows">${rows}</div></div>`;
}).join('');
const nbMax=()=>Math.max(0,nbInner.offsetHeight-nbBody.clientHeight);
const renderNb=()=>{nbInner.style.transform=`translate3d(0,${-nb.scroll}px,0)`;};
function nbTo(t,v=0){
  nb.anim&&nb.anim.stop();nb.pull=0;
  if(t===0)nb.open=false;
  nb.anim=spring({from:nb.p,to:t,velocity:v,stiffness:240,damping:28,rest:[0.002,0.02],
    onUpdate:p=>{nb.p=p;renderApp();},
    onDone:()=>{nb.anim=null;nb.open=t===1;if(t===0){nb.scroll=0;renderNb();}renderApp();}});
}
function flip(els,mutate,{dur=420,stagger=0,skip=null}={}){
  const first=new Map(els.map(e=>[e,e.getBoundingClientRect()]));
  mutate();
  els.forEach((e,i)=>{
    if(e===skip)return;
    const a=first.get(e),c=e.getBoundingClientRect();
    if(!c.width||!c.height)return;
    const dx=a.left-c.left,dy=a.top-c.top,sx=a.width/c.width,sy=a.height/c.height;
    if(Math.abs(dx)<0.5&&Math.abs(dy)<0.5&&Math.abs(sx-1)<0.01&&Math.abs(sy-1)<0.01)return;
    e.animate([{transformOrigin:'0 0',transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`},{transformOrigin:'0 0',transform:'none'}],
      {duration:reduce?1:dur,delay:reduce?0:stagger*i,easing:'cubic-bezier(.2,.9,.25,1)',fill:'backwards'});
  });
}
function setLayout(l){
  if(nbGrid.dataset.l===l)return;
  flip([...nbGrid.children],()=>{nbGrid.className='nb-grid '+l;nbGrid.dataset.l=l;nb.scroll=Math.min(nb.scroll,nbMax());renderNb();},{stagger:12});
  document.querySelectorAll('[data-layout]').forEach(x=>x.classList.toggle('on',x.dataset.layout===l));
}
function liftCard(c,x,y){
  c.getAnimations().forEach(a=>a.finish());
  const r=c.getBoundingClientRect();
  nb.lift={el:c,gx:x-(r.left+r.width/2),gy:y-(r.top+r.height/2),tx:0,ty:0,over:null};
  c.classList.add('lift');
  try{navigator.vibrate&&navigator.vibrate(8);}catch(_){}
}
function placeLift(x,y){
  const L=nb.lift,r=L.el.getBoundingClientRect();
  const bx=r.left+r.width/2-L.tx,by=r.top+r.height/2-L.ty;
  L.tx=x-L.gx-bx;L.ty=y-L.gy-by;
  L.el.style.transform=`translate3d(${L.tx}px,${L.ty}px,0)`;
}
function moveLift(x,y){
  const L=nb.lift,c=L.el;placeLift(x,y);
  const cards=[...nbGrid.children];
  const over=cards.find(o=>{if(o===c)return false;const q=o.getBoundingClientRect();return x>q.left&&x<q.right&&y>q.top&&y<q.bottom;});
  if(!over){L.over=null;return;}
  if(over===L.over)return;
  L.over=over;
  const i=cards.indexOf(c),j=cards.indexOf(over);
  flip(cards,()=>{
    nbGrid.insertBefore(c,i<j?over.nextSibling:over);
  },{skip:c,dur:300});
  placeLift(x,y);
}
function dropLift(){
  const L=nb.lift;if(!L)return;nb.lift=null;
  const c=L.el;c.classList.remove('lift');c.style.transform='';
  c.animate([{transform:`translate3d(${L.tx}px,${L.ty}px,0)`},{transform:'none'}],{duration:reduce?1:380,easing:'cubic-bezier(.2,.9,.25,1)'});
}
function nbMomentum(v){
  cancelAnimationFrame(nb.mom);let last=performance.now();const max=nbMax();
  const f=now=>{const dt=Math.min(32,now-last);last=now;nb.scroll+=v*dt/1000;v*=Math.pow(0.996,dt);
    if(nb.scroll<0){nb.scroll=0;v=0;}if(nb.scroll>max){nb.scroll=max;v=0;}
    renderNb();if(Math.abs(v)>15&&!reduce)nb.mom=requestAnimationFrame(f);};
  nb.mom=requestAnimationFrame(f);
}
gesture(notebook,{
  pressDelay:320,
  shouldStart:()=>nb.open,
  onDown(){cancelAnimationFrame(nb.mom);nb.mode=null;nb.pull=0;},
  onPress(s){const c=s.target.closest('.nb-card');if(c)liftCard(c,s.x0,s.y0);},
  onPressEnd(){dropLift();},
  onAxis(axis){
    if(nb.lift){nb.mode='reorder';return true;}
    if(axis!=='y')return false;
    nb.mode='y';return true;
  },
  onMove({ddy},s){
    if(nb.mode==='reorder'){if(nb.lift)moveLift(s.lx,s.ly);return;}
    let d=ddy;const max=nbMax();
    if(d>0){
      if(nb.scroll>0){const u=Math.min(d,nb.scroll);nb.scroll-=u;d-=u;}
      if(d>0)nb.pull+=d;
    }else if(d<0){
      if(nb.pull>0){const u=Math.max(d,-nb.pull);nb.pull+=u;d-=u;}
      if(d<0&&nb.scroll<max)nb.scroll=Math.min(max,nb.scroll-d);
    }
    nb.p=1-nb.pull/NBD();renderNb();renderApp();
  },
  onEnd({vy}){
    if(nb.mode==='reorder')return;
    if(nb.pull>0){nbTo(nb.pull>110||vy>700?0:1,-vy/NBD());return;}
    nbMomentum(-vy);
  },
  onTap(target){
    const l=target.closest('[data-layout]');if(l){setLayout(l.dataset.layout);return;}
    if(target.closest('.nb-card'))openSheet('g1');
  }
});

/* ---------- misc ---------- */
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(st.open>=1)closeStories();else if(chatOpen)closeChat();else if(sh.state!=='closed')closeSheet();else if(nb.open)nbTo(0);
});
device.addEventListener('contextmenu',e=>e.preventDefault());
function measure(){
  const r=device.getBoundingClientRect();W=r.width;H=r.height;
  sheetGeom();
  pg.anim&&pg.anim.stop();pg.x=-pg.index*W;renderPager();
  sh.ty=sh.state==='full'?FULL:sh.state==='half'?HALF:CLOSED;renderSheet();
  st.cubeX=st.g*W;renderCube();renderStories();
}
addEventListener('resize',measure);
resetStoriesState();
measure();
})();
</script>
